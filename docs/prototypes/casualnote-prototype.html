<title>CasualNote Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&family=Noto+Sans+Arabic:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+SC:wght@400;600&family=Noto+Sans+JP:wght@400;600&display=swap">
<style>
/* Layout concept: a working document, not a dashboard. Full-bleed panes split by hairlines; text keeps a reading measure while tables and boards take the full width. One radius, one accent, no decoration. */
:root {
  --bg: #fbfbfa; --side: #f3f3f1; --hover: #e9e9e6; --active: #e1e1dd; --fg: #17181a; --muted: #62656b; --faint: #8e9197; --line: #dededa; --strong: #17181a;
  --accent: #1f47d6; --accent-fg: #ffffff; --accent-soft: #e4e9fb; --tint: #f0f0ed; --mark: #ffe680; --sticky: #fbeea6; --sticky-2: #e7e7e3; --sticky-fg: #17181a; --dot: #d9d9d5;
  --shadow: 0 10px 30px rgb(23 24 26 / .16); --ink: #17181a; --ink-red: #c9341f; --ink-blue: #1f47d6; --hi: #ffd92e; --hi-blend: multiply; --radius: 4px;
  --ui: "Geist", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Noto Sans JP", "Noto Sans Arabic", "Noto Sans Devanagari", system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17181a; --side: #1d1e21; --hover: #2a2b2f; --active: #33353a; --fg: #ececea; --muted: #a3a5aa; --faint: #76787e; --line: #2f3034; --strong: #ececea;
  --accent: #8ba4ff; --accent-fg: #10131d; --accent-soft: #252c47; --tint: #222327; --mark: #6b5a0c; --sticky: #4a4315; --sticky-2: #313236; --sticky-fg: #ececea; --dot: #303135;
  --shadow: 0 10px 30px rgb(0 0 0 / .55); --ink: #ececea; --ink-red: #f08a78; --ink-blue: #8ba4ff; --hi: #8f7a10; --hi-blend: screen; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #17181a; --side: #1d1e21; --hover: #2a2b2f; --active: #33353a; --fg: #ececea; --muted: #a3a5aa; --faint: #76787e; --line: #2f3034; --strong: #ececea;
  --accent: #8ba4ff; --accent-fg: #10131d; --accent-soft: #252c47; --tint: #222327; --mark: #6b5a0c; --sticky: #4a4315; --sticky-2: #313236; --sticky-fg: #ececea; --dot: #303135;
  --shadow: 0 10px 30px rgb(0 0 0 / .55); --ink: #ececea; --ink-red: #f08a78; --ink-blue: #8ba4ff; --hi: #8f7a10; --hi-blend: screen; color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 .875rem/1.5 var(--ui); overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; border-radius: var(--radius); }
button:active { transform: translateY(1px); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
[contenteditable]:focus-visible { outline: none; }
[hidden] { display: none !important; }
.i { width: 1em; height: 1em; flex: none; display: inline-block; vertical-align: -.125em; fill: currentColor; font-size: 16px; }

#app { height: 100%; display: flex; flex-direction: column; min-height: 0; }
.main { flex: 1; min-height: 0; display: flex; position: relative; }

#side { width: 248px; flex: none; display: flex; flex-direction: column; min-height: 0; box-sizing: border-box; background: var(--side); border-inline-end: 1px solid var(--line); padding: 12px 8px 8px max(8px, env(safe-area-inset-left, 0px)); }
.ws { font-weight: 600; font-size: .9375rem; letter-spacing: -.01em; padding: 0 8px 10px; }
.nav { display: flex; align-items: center; gap: 8px; width: 100%; text-align: start; padding: 4px 8px; color: var(--muted); }
.nav:hover { background: var(--hover); color: var(--fg); }
.nav kbd { margin-inline-start: auto; font: 400 .75rem var(--ui); color: var(--faint); }
.sec { font-size: .75rem; color: var(--faint); padding: 16px 8px 4px; display: flex; justify-content: space-between; align-items: center; }
.sec button { color: var(--faint); width: 20px; height: 20px; display: grid; place-items: center; }
.sec button:hover { background: var(--hover); color: var(--fg); }
#tree { flex: 1; min-height: 0; overflow: auto; }
.row { display: flex; align-items: center; border-radius: var(--radius); padding-inline-end: 4px; color: var(--muted); }
.row:hover { background: var(--hover); color: var(--fg); }
.row.on { background: var(--active); color: var(--fg); font-weight: 500; }
.row .chev { width: 18px; height: 24px; flex: none; color: var(--faint); display: grid; place-items: center; }
.row .chev .i { font-size: 11px; }
.row .open { flex: 1; min-width: 0; display: flex; gap: 7px; align-items: center; text-align: start; padding: 3px 2px; }
.row .open span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .add { width: 20px; height: 20px; flex: none; display: grid; place-items: center; opacity: 0; }
.row:hover .add, .row .add:focus-visible { opacity: 1; }
.row .add:hover { background: var(--active); }

#center { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
#tabs { display: flex; overflow-x: auto; scrollbar-width: none; align-items: stretch; background: var(--side); border-bottom: 1px solid var(--line); flex: none; }
.tab { display: flex; align-items: center; gap: 4px; flex: none; max-width: 200px; padding: 6px; padding-inline-start: 12px; color: var(--muted); border-inline-end: 1px solid var(--line); margin-bottom: -1px; border-bottom: 1px solid transparent; }
.tab:hover { color: var(--fg); }
.tab.on { background: var(--bg); color: var(--fg); border-bottom-color: var(--bg); }
.tab .tl { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tab .cl { color: var(--faint); width: 18px; height: 18px; display: grid; place-items: center; }
.tab .cl .i { font-size: 12px; }
.tab .cl:hover { background: var(--hover); color: var(--fg); }
.tabadd { width: 32px; flex: none; color: var(--muted); display: grid; place-items: center; }
.tabadd:hover { color: var(--fg); background: var(--hover); border-radius: 0; }
#paneWrap { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.bar { display: flex; align-items: center; gap: 4px; padding: 6px max(12px, env(safe-area-inset-right, 0px)) 6px 12px; min-height: 28px; }
.crumbs { display: flex; gap: 4px; align-items: center; min-width: 0; overflow: hidden; color: var(--faint); white-space: nowrap; flex: 1; }
.crumbs button { padding: 1px 4px; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.crumbs button:hover { background: var(--hover); }
.crumbs b { color: var(--fg); font-weight: 400; overflow: hidden; text-overflow: ellipsis; padding-inline: 4px; }
.mode { display: inline-flex; flex: none; border: 1px solid var(--line); border-radius: var(--radius); margin-right: 6px; }
.mode button { padding: 3px 10px; border-radius: 0; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.mode button + button { border-inline-start: 1px solid var(--line); }
.mode button:hover { color: var(--fg); }
.mode button[aria-pressed="true"] { background: var(--strong); color: var(--bg); }
.ibtn { width: 28px; height: 28px; flex: none; color: var(--muted); display: inline-grid; place-items: center; }
.ibtn:hover { background: var(--hover); color: var(--fg); }
.ibtn[aria-pressed="true"] { color: var(--fg); }
#content { flex: 1; min-height: 0; position: relative; display: flex; }

.docscroll { flex: 1; overflow: auto; overscroll-behavior: contain; }
.doc { padding-block: 28px 120px; padding-inline: 72px 40px; box-sizing: border-box; max-width: 1120px; }
.title { font-size: 2.25rem; line-height: 1.15; font-weight: 600; letter-spacing: -.025em; margin: 0 0 20px; outline: none; overflow-wrap: anywhere; max-width: 22ch; text-wrap: balance; }
.title:empty::before { content: var(--untitled, "Untitled"); color: var(--faint); }
.blocks { display: flex; flex-direction: column; }
.b { position: relative; display: flex; gap: 6px; align-items: flex-start; padding: 2px 0; font-size: 1rem; line-height: 1.6; max-width: 68ch; }
.b.db { max-width: none; }
.b.drop-before::before, .b.drop-after::after { content: ""; position: absolute; left: 0; right: 0; height: 2px; background: var(--accent); z-index: 2; }
.b.drop-before::before { top: -1px; } .b.drop-after::after { bottom: -1px; }
.gutter { position: absolute; inset-inline-start: -46px; top: 4px; display: flex; opacity: 0; }
.b:hover > .gutter, .gutter:focus-within { opacity: 1; }
.gutter button { width: 22px; height: 22px; color: var(--faint); display: grid; place-items: center; touch-action: none; }
.gutter button:hover { background: var(--hover); color: var(--fg); }
.gutter .hd { cursor: grab; }
.t { flex: 1; min-width: 0; outline: none; overflow-wrap: anywhere; white-space: pre-wrap; }
.t.ph:empty::before { content: attr(data-ph); color: var(--faint); }
.b:not(:focus-within) > .t.ph:empty::before { content: ""; }
.b.h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -.02em; line-height: 1.3; padding-top: 24px; }
.b.h2 { font-size: 1.1875rem; font-weight: 600; letter-spacing: -.01em; line-height: 1.35; padding-top: 22px; }
.b.h3 { font-size: 1rem; font-weight: 600; padding-top: 12px; }
.b.ul > .mk { width: 18px; flex: none; text-align: center; color: var(--muted); }
.b.ol > .mk { min-width: 18px; flex: none; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.b.todo input { width: 15px; height: 15px; margin: 5px 4px 0 1px; accent-color: var(--strong); flex: none; }
.b.todo.done .t { color: var(--faint); text-decoration: line-through; }
.b.quote { padding-inline-start: 18px; color: var(--muted); font-style: italic; margin-block: 4px; }
.b.callout { background: var(--tint); padding: 10px 12px; border-radius: var(--radius); margin-block: 8px; gap: 10px; }
.b.callout > .i { margin-top: 5px; color: var(--muted); }
.b.code { background: var(--tint); border-radius: var(--radius); padding: 10px 14px; margin-block: 8px; font: 400 .8125rem/1.6 var(--mono); }
.b.hr { padding-block: 12px; } .b.hr hr { flex: 1; border: 0; border-top: 1px solid var(--line); margin: 0; }
.t b { font-weight: 600; } .t code { font: .86em var(--mono); background: var(--tint); padding: 1px 4px; border-radius: var(--radius); } .t mark { background: var(--mark); color: inherit; }
.ref { color: var(--fg); cursor: pointer; text-decoration: underline; text-decoration-color: var(--faint); text-decoration-thickness: 1px; text-underline-offset: 3px; }
.ref:hover { color: var(--accent); text-decoration-color: var(--accent); }
.ref.gone { color: var(--faint); text-decoration: line-through; }
.tail { min-height: 90px; cursor: text; }

.db { margin-block: 6px; width: 100%; min-width: 0; font-size: .875rem; line-height: 1.45; }
.dbhead { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.dbname { font-weight: 600; font-size: .9375rem; border: 0; background: none; min-width: 80px; flex: 0 1 180px; padding-block: 2px; padding-inline: 0 4px; outline: none; border-radius: var(--radius); }
.dbname:focus { background: var(--hover); }
.vtabs { display: flex; gap: 2px; }
.vtabs button { padding: 2px 8px; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; }
.vtabs button:hover { background: var(--hover); }
.vtabs button[aria-pressed="true"] { color: var(--fg); background: var(--active); }
.newbtn { margin-inline-start: auto; background: var(--accent); color: var(--accent-fg); padding: 3px 12px; font-weight: 500; }
.tablewrap { overflow-x: auto; }
table.grid { border-collapse: collapse; width: 100%; min-width: 560px; }
.grid th { text-align: start; font-weight: 400; color: var(--faint); font-size: .8125rem; padding: 6px 8px; white-space: nowrap; }
.grid th:first-child, .grid td:first-child input { padding-inline-start: 0; }
.grid td { border-top: 1px solid var(--line); padding: 0; }
.grid input { width: 100%; box-sizing: border-box; border: 0; background: none; padding: 6px 8px; outline: none; border-radius: var(--radius); }
.grid input:focus { background: var(--hover); }
.grid .pcell { padding: 4px 8px; }
.rowdel { width: 26px; height: 26px; color: var(--faint); opacity: 0; display: grid; place-items: center; }
.grid tr:hover .rowdel, .rowdel:focus-visible { opacity: 1; }
.addrow { display: block; width: 100%; text-align: start; color: var(--faint); padding: 6px 0; }
.addrow:hover { color: var(--fg); }
.st { display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; color: var(--fg); }
.st .i { font-size: 15px; color: var(--muted); }
.st.done .i { color: var(--strong); }
.st.done { color: var(--muted); }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(190px, 1fr); overflow-x: auto; }
.lane { padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 6px; border-inline-end: 1px solid var(--line); min-height: 180px; }
.lane:first-child { padding-inline-start: 0; } .lane:last-child { border-inline-end: 0; padding-inline-end: 0; }
.lane.over { background: var(--accent-soft); }
.lane header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 4px; font-size: .8125rem; }
.lane header > span:last-child { color: var(--faint); font-variant-numeric: tabular-nums; }
.card { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; cursor: grab; touch-action: none; }
.card:hover { border-color: var(--faint); }
.card.lift { position: fixed; z-index: 90; box-shadow: var(--shadow); pointer-events: none; width: 196px; box-sizing: border-box; }
.card b { font-weight: 400; display: block; overflow-wrap: anywhere; }
.card small { color: var(--faint); display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; font-size: .75rem; font-variant-numeric: tabular-nums; }
.lane .addrow { padding: 2px 0; font-size: .8125rem; }

.canvas { flex: 1; min-width: 0; position: relative; overflow: hidden; touch-action: none; cursor: default; background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); border-top: 1px solid var(--line); }
.canvas.draw { cursor: crosshair; }
.canvas.grabbing { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
.canvas.draw .world { pointer-events: none; }
.note { position: absolute; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); box-sizing: border-box; }
.note .grip { height: 20px; cursor: grab; display: grid; place-items: center; color: var(--faint); touch-action: none; user-select: none; -webkit-user-select: none; }
.note .grip:hover { background: var(--hover); }
.note .body { padding: 2px 24px 18px; }
.note .gutter { inset-inline-start: -24px; } .note .gutter .add { display: none; }
.note .title { font-size: 1.375rem; margin: 2px 0 10px; }
.note .tail { min-height: 24px; }
.ci { position: absolute; box-sizing: border-box; display: flex; align-items: center; justify-content: center; cursor: grab; touch-action: none; }
.ci .txt { outline: none; min-width: 12px; cursor: text; white-space: pre-wrap; overflow-wrap: anywhere; width: 100%; font-size: .9375rem; line-height: 1.4; color: var(--sticky-fg); }
.ci.sticky { padding: 12px; align-items: flex-start; border-radius: var(--radius); }
.ci.c-amber { background: var(--sticky); } .ci.c-grey { background: var(--sticky-2); }
.ci.rect, .ci.ellipse { padding: 10px; border: 1.5px solid var(--strong); border-radius: var(--radius); background: var(--bg); text-align: center; } .ci.rect .txt, .ci.ellipse .txt { color: var(--fg); text-align: center; }
.ci.ellipse { border-radius: 50%; padding: 14px; }
.ci.text { padding: 2px 4px; } .ci.text .txt { font-size: 1.125rem; color: var(--fg); }
.ci.sel { outline: 1.5px solid var(--accent); outline-offset: 2px; }
.rz { position: absolute; right: -5px; bottom: -5px; width: 10px; height: 10px; background: var(--bg); border: 1.5px solid var(--accent); cursor: nwse-resize; touch-action: none; box-sizing: border-box; display: none; }
.ci.sel .rz, .note:hover .rz { display: block; }
.inklayer { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
.inklayer .c-ink { fill: var(--ink); } .inklayer .c-red { fill: var(--ink-red); } .inklayer .c-blue { fill: var(--ink-blue); }
.inklayer .hi { fill: var(--hi); opacity: .55; mix-blend-mode: var(--hi-blend); }
.inklayer .arrow { stroke: var(--strong); stroke-width: 1.5; fill: none; }
.inklayer .head { fill: var(--strong); }
.dock { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); z-index: 5; }
.dock button { width: 34px; height: 34px; flex: none; display: grid; place-items: center; color: var(--muted); border-radius: 0; }
.dock button .i { font-size: 18px; }
.dock button:hover { background: var(--hover); color: var(--fg); }
.dock button[aria-pressed="true"] { background: var(--strong); color: var(--bg); }
.dock .sep { height: 1px; background: var(--line); flex: none; }
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); z-index: 5; }
.zoom button { padding: 3px 9px; color: var(--muted); border-radius: 0; } .zoom button:hover { background: var(--hover); color: var(--fg); }
.zoom span { font-size: .75rem; min-width: 38px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }

#right { width: 300px; flex: none; min-height: 0; box-sizing: border-box; border-inline-start: 1px solid var(--line); display: flex; flex-direction: column; }
.rtabs { display: flex; border-bottom: 1px solid var(--line); background: var(--side); flex: none; }
.rtabs button { flex: 1; padding: 6px 4px; color: var(--muted); border-radius: 0; border-inline-end: 1px solid var(--line); margin-bottom: -1px; border-bottom: 1px solid transparent; }
.rtabs button:last-child { border-inline-end: 0; }
.rtabs button[aria-selected="true"] { background: var(--bg); color: var(--fg); border-bottom-color: var(--bg); }
#rpDetails { flex: 1; min-height: 0; overflow: auto; padding: 14px max(12px, env(safe-area-inset-right, 0px)) 14px 12px; display: flex; flex-direction: column; gap: 22px; }
#detailPage, #detailNode { display: flex; flex-direction: column; gap: 22px; }
.rel { display: flex; align-items: baseline; gap: 8px; padding: 3px 0; font-size: .8125rem; }
.rel > button:first-child { flex: 1; min-width: 0; text-align: start; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rel > button:first-child:hover { color: var(--accent); }
.rel span { color: var(--faint); font-size: .75rem; font-variant-numeric: tabular-nums; }
.rel .lk { color: var(--accent); font-size: .75rem; }
.textlink { color: var(--accent); font-size: .8125rem; text-align: start; }
.localg svg { display: block; width: 100%; height: auto; }
.localg line { stroke: var(--line); stroke-width: 1.2; }
.localg line.sim { stroke-dasharray: 3 3; }
.localg circle { fill: var(--faint); cursor: pointer; } .localg circle:hover { fill: var(--accent); } .localg circle.cur { fill: var(--strong); }
.nodehead h3 { margin: 0; font-size: 1.0625rem; font-weight: 600; letter-spacing: -.01em; overflow-wrap: anywhere; }
.nodehead small { color: var(--faint); font-size: .75rem; }

.gv { flex: 1; min-width: 0; position: relative; overflow: hidden; border-top: 1px solid var(--line); touch-action: none; }
#gsvg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
#gsvg.grabbing { cursor: grabbing; }
#gsvg line { stroke: var(--line); stroke-width: 1.2; }
#gsvg line.e-link, #gsvg line.e-embed { stroke: var(--muted); }
#gsvg line.e-similar { stroke: var(--accent); stroke-dasharray: 4 4; opacity: .7; }
.n { cursor: pointer; }
.n .sh { fill: var(--strong); }
.n.k-tag .sh { fill: var(--bg); stroke: var(--strong); stroke-width: 1.5; }
.n.k-row .sh { fill: var(--faint); }
.n.k-person .sh { fill: var(--bg); stroke: var(--muted); stroke-width: 1.5; }
.n text { font: 500 11px var(--ui); fill: var(--fg); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
.n.k-row text, .n.k-person text, .n.k-tag text { font-weight: 400; fill: var(--muted); opacity: 0; }
#gsvg.zoomed .n text, .n.hl text, .n.sel text { opacity: 1; }
.n.sel .sh { fill: var(--accent); stroke: var(--accent); }
#gsvg.focus .n:not(.hl):not(.sel) { opacity: .16; }
#gsvg.focus line:not(.hl) { opacity: .1; }
#gsvg line.hl { stroke: var(--strong); opacity: 1; }
.n.miss { opacity: .12; }
.gctl { position: absolute; inset-inline-start: 12px; top: 12px; width: 180px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; display: flex; flex-direction: column; gap: 3px; font-size: .8125rem; z-index: 2; }
.gctl input[type=search] { box-sizing: border-box; width: 100%; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); padding: 3px 6px; margin-bottom: 5px; outline-offset: 0; }
.gctl label { display: flex; align-items: center; gap: 7px; color: var(--muted); }
.gctl input[type=checkbox] { accent-color: var(--strong); margin: 0; }

    { gl: "file-text", label: t("New page"), run: () => newPage(null) }, { gl: "kanban", label: "New database", run: () => newPage(null, "db") }]) }, icon("plus"))));
  live().filter(p => !p.parent || !P(p.parent) || P(p.parent).trash).forEach(p => row(p, 0, true));

function renderContent() { if (S.sv === "graph") return renderGraphView(); if (S.sv === "agent") return renderAgentView(); if (S.sv === "settings") return renderSettings(); const p = cur(); if (p.kind === "doc" && p.mode === "canvas") renderCanvas(p); else renderDoc(p); }

/* Search */
function openSearch() {
  closeModal();
  const input = el("input", { id: "palette", type: "search", placeholder: "Search pages and text", "aria-label": "Search" });
  const list = el("div", { class: "list" });
  let on = 0, hits = [];
  const paint = () => {
    const q = input.value.trim().toLowerCase(); hits = [];
    live().forEach(p => {
      if (!q) { hits.push({ p }); return; }
      if ((p.title || "Untitled").toLowerCase().includes(q)) hits.push({ p });
      (p.blocks || []).forEach(b => { const t = plain(b.runs); if (t.toLowerCase().includes(q)) hits.push({ p, t, b: b.id }); });
      p.canvas.items.forEach(i => { if ((i.text || "").toLowerCase().includes(q)) hits.push({ p, t: i.text }); });
      [p.db, ...(p.blocks || []).map(x => x.db)].filter(Boolean).forEach(id => S.dbs[id]?.rows.forEach(r => { if (r.name.toLowerCase().includes(q)) hits.push({ p, t: r.name }); }));
    });
    hits = hits.slice(0, 30);
    if (q) { const seen = new Set(hits.map(h => h.p.id)); similarTo(q, 8).filter(h => !seen.has(h.p.id)).slice(0, 5).forEach(h => { seen.add(h.p.id); hits.push({ p: h.p, t: h.t, b: h.b, rel: true }); }); }
    on = Math.min(on, Math.max(0, hits.length - 1));
    const firstRel = hits.findIndex(h => h.rel);
    list.replaceChildren(...hits.flatMap((h, i) => [i === firstRel ? el("div", { class: "hdr", text: t("Related") }) : null, el("button", { class: "mi" + (i === on ? " on" : ""), onclick: () => go(h) }, el("span", { class: "gl" }, icon(pageIcon(h.p))), el("span", {}, h.p.title || "Untitled", h.t ? el("small", {}, mark(h.t, q)) : null))].filter(Boolean)));
    if (!hits.length) list.append(el("div", { class: "hdr", text: `Nothing matches "${input.value}".` }));
  };

  paint(); input.focus();
}
function modal(node) { document.body.append(el("div", { class: "modalbg", onpointerdown: e => { if (e.target.classList.contains("modalbg")) closeModal(); } }, node)); }

/* Export */
function toMd(page) {
  const inline = rs => (rs || []).map(r => r.ref ? `[[${refTitle(r.ref)}]]` : (r.c ? "`" + r.t + "`" : r.b ? `**${r.t}**` : r.i ? `*${r.t}*` : r.h ? `==${r.t}==` : r.t)).join("");
  const dbMd = db => { const cols = ["Name", "Status", ...db.cols.map(c => c.name)]; return [`| ${cols.join(" | ")} |`, `| ${cols.map(() => "---").join(" | ")} |`, ...db.rows.map(r => `| ${[r.name, db.statuses.find(s => s.id === r.status)?.name, ...db.cols.map(c => r[c.id] || "")].join(" | ")} |`)].join("\n"); };
  const out = [`# ${page.title || "Untitled"}`, ""]; let n = 0;
  if (page.kind === "db") out.push(dbMd(S.dbs[page.db]));

    n = b.type === "ol" ? n + 1 : 0; const t = inline(b.runs);
    out.push({ p: t, h1: `# ${t}`, h2: `## ${t}`, h3: `### ${t}`, ul: `- ${t}`, ol: `${n}. ${t}`, todo: `- [${b.done ? "x" : " "}] ${t}`, quote: `> ${t}`, callout: `> ${t}`, code: "```\n" + t + "\n```", hr: "---", embed: b.page ? `![[${refTitle(b.page)}]]` : "", db: b.db && S.dbs[b.db] ? dbMd(S.dbs[b.db]) : "" }[b.type], "");
  }

}

    el("div", { class: "foot" }, el("button", { class: "btn", text: "Close", onclick: closeModal }),
      el("button", { class: "btn primary", text: "Copy", onclick: () => navigator.clipboard.writeText(text).then(() => toast("Copied."), () => toast("Your browser refused. Select the text instead.")) }))));
}
