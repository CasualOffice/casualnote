[workspace]
resolver = "3"
members = ["crates/casual-note-model", "crates/casual-note-merge", "crates/casual-note-ops", "crates/casual-note-wasm", "crates/casual-note-search", "crates/casual-note-graph", "crates/casual-note-package", "crates/casual-note-tools", "server/casual-note-mcp"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Disk is tight on this machine, and full debug info is most of a build's size.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
strip = "symbols"
overflow-checks = true
