[workspace]
resolver = "3"
members = ["crates/casual-note-model", "crates/casual-note-merge", "crates/casual-note-ops", "crates/casual-note-wasm"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
strip = "symbols"
overflow-checks = true
