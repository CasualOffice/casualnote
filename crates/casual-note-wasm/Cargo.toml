[package]
publish = false
name = "casual-note-wasm"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
casual-note-model = { path = "../casual-note-model" }
casual-note-merge = { path = "../casual-note-merge" }
casual-note-ops = { path = "../casual-note-ops" }
casual-note-search = { path = "../casual-note-search" }
casual-note-graph = { path = "../casual-note-graph" }
casual-note-package = { path = "../casual-note-package" }
casual-note-tools = { path = "../casual-note-tools" }
casual-note-store = { path = "../casual-note-store" }
casual-note-sync = { path = "../casual-note-sync" }
casual-note-embed = { path = "../casual-note-embed" }
serde_json = "1"
wasm-bindgen = "0.2"

# wasm-pack's bundled wasm-opt fails on this module. Size work is PERF-14.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lints]
workspace = true
