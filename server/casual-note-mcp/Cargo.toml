[package]
name = "casual-note-mcp"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "An MCP server (stdio) over CasualNote notebook files (docs/63)."

# The protocol is JSON-RPC 2.0 over stdin and stdout on `serde_json`. There is no MCP framework,
# async runtime or network stack in this binary.
[dependencies]
casual-note-merge = { path = "../../crates/casual-note-merge" }
casual-note-tools = { path = "../../crates/casual-note-tools" }
serde_json = "1"

[dev-dependencies]
casual-note-model = { path = "../../crates/casual-note-model" }
casual-note-ops = { path = "../../crates/casual-note-ops" }

[lints]
workspace = true
